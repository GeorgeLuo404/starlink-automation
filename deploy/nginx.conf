# 星链自动化 — Nginx 反向代理
# 阿里云 ECS 生产环境示例。证书路径按实际调整。

# 上传的 SVG 单独打开时会在本站域名下执行其中的脚本，加沙箱只当图片显示（与 next.config.ts 一致）
map $uri $uploads_csp {
    ~*\.svgz?$ "default-src 'none'; img-src data:; style-src 'unsafe-inline'; sandbox";
    default    "";
}

upstream starlink_web {
    server web:3000;
    keepalive 32;
}

# HTTP -> HTTPS
server {
    listen 80;
    server_name www.starlink-auto.com starlink-auto.com;

    # 阿里云证书校验 / Let's Encrypt HTTP-01
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.starlink-auto.com starlink-auto.com;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 210m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript application/x-javascript
               text/xml application/xml image/svg+xml;

    # 上传文件统一以 /uploads/<key> 访问。
    # STORAGE_DRIVER=local：直接读取与 web 容器共享的卷。
    # 注意：location 里一旦写了 add_header，server 级的 add_header 就不再继承，所以下面重复写上需要的头。
    location /uploads/ {
        alias /var/www/uploads/;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy $uploads_csp always;
    }

    # STORAGE_DRIVER=s3（阿里云 OSS）：用下面的配置替换上面的 location，代理到存储桶。
    # 同地域的 ECS 使用 -internal 内网地址，不产生外网流量费。
    # location /uploads/ {
    #     proxy_pass https://starlink-automation.oss-cn-shenzhen-internal.aliyuncs.com/;
    #     proxy_set_header Host starlink-automation.oss-cn-shenzhen-internal.aliyuncs.com;
    #     proxy_ssl_server_name on;
    #     proxy_hide_header Content-Disposition;
    #     expires 30d;
    #     add_header X-Content-Type-Options "nosniff" always;
    #     add_header Content-Security-Policy $uploads_csp always;
    # }

    location /_next/static/ {
        proxy_pass http://starlink_web;
        proxy_cache_valid 200 365d;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://starlink_web;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_buffering off;
    }
}
